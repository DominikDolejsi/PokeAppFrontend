pre-push:
  jobs:
    - name: packages audit
      tags:
        - frontend
        - security
      run: deno audit

pre-commit:
  jobs:
    - name: lint
      run: deno lint {staged_files}
      glob: "*.ts"

    - name: fmt
      run: deno fmt {staged_files}
      glob: "*.{ts,md,yaml,json}"

    - name: typecheck
      run: deno check {staged_files}
      glob: "*.ts"
